<style>
/* Layout: one survey sheet on a faint plat grid. A single column of station cards, and a results page that reads like a survey report. */
:root{
  --bg:#ECF0EE; --surface:#F8FAF9; --ink:#14201E; --ink2:#4A5A57; --line:#C5CFCB; --grid:#DCE3E0;
  --accent:#C74600; --accent-ink:#FFFFFF; --sel:#FBE7DA; --teal:#0B6560; --teal-soft:#D3E8E5;
  --font-d:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-b:'Source Serif 4','Iowan Old Style','Georgia',serif;
  --font-m:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1312; --surface:#131C1A; --ink:#E7EFEC; --ink2:#9BAEA9; --line:#2A3835; --grid:#16201E;
    --accent:#FF8A3D; --accent-ink:#1B0F06; --sel:#2C1B10; --teal:#5CC4BB; --teal-soft:#15312E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#131C1A; --ink:#E7EFEC; --ink2:#9BAEA9; --line:#2A3835; --grid:#16201E;
  --accent:#FF8A3D; --accent-ink:#1B0F06; --sel:#2C1B10; --teal:#5CC4BB; --teal-soft:#15312E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg); color:var(--ink); font:17px/1.55 var(--font-b);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; padding-inline:16px; padding-block:0; min-height:100vh;
}
#app{max-width:640px;margin:0 auto;padding-block:0 28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:baseline;padding-block:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3}
.brand{font:700 15px var(--font-d);letter-spacing:.02em}
.count{font:500 13px var(--font-m);color:var(--ink2);font-variant-numeric:tabular-nums}
.prog{position:sticky;top:calc(env(safe-area-inset-top,0px) + 42px);height:4px;background:var(--line);z-index:3;margin-bottom:22px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.prog b{position:absolute;top:-3px;width:1px;height:10px;background:var(--ink2)}

.eyebrow{font:500 12px var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 18px 18px}
.q{font:700 clamp(22px,5.4vw,28px)/1.2 var(--font-d);margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}
.note{margin:0 0 14px;color:var(--ink2);font-size:15px}
#qbody{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hint{min-height:1.4em;margin:12px 0 0;font:500 13px var(--font-m);color:var(--accent)}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;min-width:0}
.opt:hover{border-color:var(--ink2)}
.opt.on{border-color:var(--accent);background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
.otxt{min-width:0;overflow-wrap:anywhere;line-height:1.4}
.key{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--ink2);border-radius:4px;font:500 13px var(--font-m);color:var(--ink2)}
.opt.on .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link{align-self:flex-start;background:none;border:0;padding:6px 0;font:500 13px var(--font-m);color:var(--ink2);text-decoration:underline;cursor:pointer}

.grow{padding-block:12px;border-top:1px solid var(--line)}
.grow:first-child{border-top:0;padding-top:0}
.glabel{margin:0 0 8px;font:600 15px var(--font-d)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px;line-height:1.25;cursor:pointer}
.pill:hover{border-color:var(--ink2)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.arow{padding-block:6px}
.arow label{display:block;font:600 15px var(--font-d);margin-bottom:4px}
.aline{display:flex;gap:12px;align-items:center}
.aline input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.aline output{flex:none;width:44px;text-align:right;font:500 14px var(--font-m);font-variant-numeric:tabular-nums}

.nav{display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:18px;border-top:1px solid var(--line)}
.btn{padding:12px 20px;border:1px solid var(--ink);border-radius:6px;background:transparent;font:600 15px var(--font-d);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav .primary{flex:1;max-width:260px}
.row{display:flex;flex-wrap:wrap;gap:10px}

.intro{padding-top:min(14vh,96px)}
.intro h1{font:700 clamp(52px,16vw,92px)/.95 var(--font-d);letter-spacing:-.03em;margin:0 0 18px}
.lede{font-size:19px;line-height:1.5;margin:0 0 18px;max-width:34em}
.facts{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px;font:400 14px var(--font-m);color:var(--ink2)}
.facts span{color:var(--ink);font-weight:500;display:inline-block;min-width:2.4ch}
.aside{margin:0 0 24px;color:var(--ink2);font-size:16px;max-width:34em}

.res{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 18px;margin-bottom:14px}
.res h3{font:700 20px var(--font-d);margin:0 0 12px}
.res p{margin:0 0 12px}
.big{font:700 clamp(34px,9vw,52px)/1.02 var(--font-d);letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.match{font:400 14px var(--font-m);color:var(--ink2)}
.match span{font:700 22px var(--font-d);color:var(--accent);margin-right:2px}
.map{display:block;width:100%;max-width:420px;margin:14px auto 8px}
.plot{fill:var(--bg);stroke:var(--ink2);stroke-width:1}
.cross{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.axl{font:500 10px var(--font-m);letter-spacing:.1em;fill:var(--ink2)}
.clab{font:500 11px var(--font-m);fill:var(--ink2)}
.tdot{fill:var(--teal)}
.tlab{font:500 12px var(--font-m);fill:var(--teal)}
.you{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.ylab{font:700 14px var(--font-d);fill:var(--ink)}
.cap{font-size:14px;color:var(--ink2);margin:0}

.think{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.think li{padding-left:14px;border-left:3px solid var(--teal)}
.think b{font-family:var(--font-d);font-weight:700}

.meter{margin-bottom:16px}
.mname{font:600 14px var(--font-d);margin:0 0 6px!important}
.mbar{position:relative;height:6px;background:var(--line);border-radius:3px;margin:0 7px}
.mbar i{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-sizing:border-box;box-shadow:0 0 0 1px var(--ink2)}
.mends{display:flex;justify-content:space-between;gap:12px;margin:8px 0 0!important;font:400 12px var(--font-m);color:var(--ink2)}

.evid{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.evid li{font-size:16px}
.eh{display:block;font:500 12px var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}

.swaps{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:12px}
.swaps li{border-top:1px solid var(--line);padding-top:10px}
.swaps p{font-size:15px;margin:4px 0 0!important;color:var(--ink2)}
.sh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sh b{font:600 15px var(--font-d)}
.chip{font:500 12px var(--font-m);padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.chip.g0{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-soft)}
.chip.g2{background:var(--sel);color:var(--accent);border-color:var(--accent)}
.copybox{width:100%;min-height:150px;margin-top:12px;padding:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:13px/1.5 var(--font-m)}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s ease}.opt,.pill{transition:border-color .12s,background-color .12s}}
@media (max-width:420px){.card{padding:18px 14px 14px}.res{padding:16px 14px}}
</style>

// Plumb Line v2 data: claims, labels, stances, questions. Plain language; labels are never shown until results.
var CLAIMS = {
  e_public:"Major industries like energy, banks and transport should be owned by the public or by their workers.",
  e_abolish:"Private ownership of big industry should be abolished.",
  e_plan:"The government should plan what the economy produces.",
  e_coop:"Companies should be owned by the people who work in them and compete in a market.",
  e_welfare:"Taxes should pay for health care, education and pensions for everyone.",
  e_union:"Unions and regulation should balance the power of owners.",
  e_market:"Free trade and private property do the most to protect freedom.",

  m_conflict:"On pay and conditions, owners and workers want opposite things.",
  m_power:"People who own lots of capital get more say in politics.",

  k_inherit:"Inherited institutions hold knowledge no planner has, so change should be slow and tested.",

  t_relig_law:"Religious law should override elected law.",

  t_oneparty:"One party should rule on behalf of the people.",

};

// side: L / R / N (for the cross-the-aisle panel). has/not are claim ids; not-claims count 0.6.
var LABELS = [
  {id:"communist", name:"Communist", side:"L", fam:"Left", has:["e_abolish","e_plan","t_revolution","t_oneparty","m_value","m_conflict"], not:["e_market"], anchors:"Marx, Engels, Lenin", tell:"Private ownership of major industry should end, the economy should be planned, and the change may need revolution and a transitional state."},
  {id:"demsoc", name:"Democratic socialist", side:"L", fam:"Left", has:["e_public","e_union","m_conflict","m_power","e_welfare"], not:["t_revolution","e_abolish"], anchors:"Debs, Harrington", tell:"Major industry and finance should be publicly or worker owned, and change should come by elections, not revolution."},
  {id:"marketsoc", name:"Market socialist", side:"L", fam:"Left", has:["e_coop","m_value","e_union","e_public"], not:["e_plan","e_abolish"], anchors:"Roemer, Dahl, the Mondragon model", tell:"Firms are owned by their workers and compete in markets. Outside shareholders do not own capital."},
  {id:"socdem", name:"Social democrat", side:"L", fam:"Left", has:["e_welfare","e_union","l_fix","l_rights"], not:["e_abolish","e_public","t_revolution"], anchors:"Bernstein, the Nordic model, Rawls", tell:"Private business stays, but taxes fund universal services and unions and regulation balance owners."},

  {id:"liberal", name:"Liberal", side:"L", fam:"Left", has:["l_rights","l_choice","l_fix"], not:["t_statefirst","e_abolish","n_over_rights"], anchors:"Locke, Mill, Kant, Paine, FDR", tell:"Individual rights come first. Government is limited but may correct market failures and protect the weak."},
  {id:"leftpop", name:"Left populist", side:"L", fam:"Center", has:["e_econ_elite","e_jobs","m_power","e_welfare"], not:["n_ancestry"], anchors:"Bryan, the People's Party, Huey Long", tell:"Ordinary people are cheated by a distant economic elite, and government should protect jobs and wages."},
  {id:"rightpop", name:"Right populist", side:"R", fam:"Center", has:["e_cult_elite","n_native","n_borders","e_jobs"], not:["s_expert"], anchors:"Jackson, Pat Buchanan", tell:"Ordinary people are cheated by a distant cultural and political elite, and borders and trade should serve the native-born worker."},
  {id:"classlib", name:"Classical liberal", side:"R", fam:"Right", has:["e_market","l_rights","l_fix"], not:["e_plan","e_public","e_abolish","t_statefirst"], anchors:"Locke, Adam Smith, Madison", tell:"Property, contract and free trade protect liberty. Government is limited to courts, defense and basic rules."},
  {id:"libertarian", name:"Libertarian", side:"R", fam:"Right", has:["e_small","l_choice","e_market","l_rights"], not:["e_welfare","e_plan","l_fix","tt_ban","t_statefirst"], anchors:"Nozick, Milton Friedman", tell:"Government should be far smaller, taxes beyond a minimal state are coercion, and personal choices are nobody else's business."},

  {id:"natcon", name:"National conservative", side:"R", fam:"Right", has:["n_loyal","n_borders","n_native","k_inherit"], not:["t_statefirst","n_over_rights"], anchors:"Hazony", tell:"The nation is the main unit of loyalty. Borders, shared culture and national interest outrank global rules, but rights and elections stay."},
  {id:"nationalist", name:"Nationalist", side:"R", fam:"Right", has:["n_ancestry","n_immig","n_over_rights","n_loyal"], not:["f_inst"], anchors:"Herder, Fichte", tell:"The nation is defined by shared ancestry or culture, and its interests outrank other nations' and, when they clash, individual rights."},
  {id:"relcon", name:"Religious conservative", side:"R", fam:"Right", has:["r_faith","r_law","k_order"], not:["t_relig_law"], anchors:"Aquinas, Augustine", tell:"Public life should rest on moral truths drawn from faith, and law may support family and worship."},
  {id:"authtrad", name:"Authoritarian traditionalist", side:"R", fam:"Authoritarian", has:["k_obey","k_order","k_inherit"], not:["l_choice","l_rights"], anchors:"Hobbes, Filmer", tell:"A strong ruler or council should enforce inherited order, and obedience and hierarchy keep society stable."},
  {id:"monarchist", name:"Monarchist", side:"R", fam:"Authoritarian", has:["t_hered","t_crown","k_inherit","k_obey"], not:[], anchors:"Filmer, de Maistre, Bagehot (constitutional)", tell:"Sovereignty rests in a hereditary crown, not in the people. Constitutional versions keep the crown ceremonial and above party."},
  {id:"fascist", name:"Fascist", side:"R", fam:"Authoritarian", has:["t_violence","t_statefirst","t_oneparty","n_unity","n_over_rights"], not:["l_rights"], anchors:"Gentile and Mussolini, The Doctrine of Fascism (1932)", tell:"The nation is one body and the state is its will. Individuals serve it, and violence and one-party rule are acceptable."},
  {id:"theocrat", name:"Theocrat", side:"R", fam:"Authoritarian", has:["t_relig_law","t_relig_dissent","r_faith","r_law"], not:["l_rights"], anchors:"Calvin's Geneva, modern Islamic republics", tell:"Religious authorities should hold political power and law should be religious law."},
  {id:"anarchist", name:"Anarchist", side:"N", fam:"Authoritarian", has:["a_nostate","a_illegit","l_choice"], not:["t_statefirst","tt_ban"], anchors:"Proudhon, Kropotkin, Rothbard (market anarchism)", tell:"Legitimate authority is rare, and society should be voluntary and self-governed with no state."}
];
LABELS.forEach(function(l){ if(l.id==="anarchist") l.fam="Anarchist"; });

var EDGES = [
  {id:"communist", name:"Communist", claims:["e_abolish","t_oneparty","t_revolution"]},
  {id:"fascist", name:"Fascist", claims:["t_violence","t_statefirst","t_oneparty"]},
  {id:"theocrat", name:"Theocrat", claims:["t_relig_law","t_relig_dissent"]},
  {id:"anarchist", name:"Anarchist", claims:["a_nostate"]},
  {id:"monarchist", name:"Monarchist", claims:["t_hered","t_crown"]},
  {id:"nationalist", name:"Nationalist", claims:["n_over_rights","n_ancestry"]}
];

var STANCES = [
  {id:"internationalist", name:"Liberal internationalist", has:["f_inst","f_rights","f_trade"], not:["f_noally"], anchors:"Kant (Perpetual Peace, 1795), Wilson", tell:"Peace comes from treaties, trade and shared institutions, and democracies should act together to protect rights abroad."},
  {id:"interventionist", name:"Interventionist", has:["f_force","f_deter","f_rights"], not:["f_noally","f_vital"], anchors:"T. Roosevelt, Truman", tell:"A strong military should be used early to shape events and deter rivals, because weakness invites attack."},
  {id:"realist", name:"Realist or restrained", has:["f_vital","f_other"], not:["f_force","f_rights","f_noally","f_inst"], anchors:"Kennan, Washington's Farewell Address", tell:"Fight only for vital interests. Other states act from their own interests, so do not try to remake them."},
  {id:"nonint", name:"Non-interventionist", has:["f_noally","f_vital","f_trade"], not:["f_force","f_inst","f_deter"], anchors:"Jefferson's first inaugural, Ron Paul", tell:"No permanent alliances or foreign wars beyond defense of the homeland, but trade with everyone."}
];

// Axis weights for the map. x: collective(-) to markets(+). y: liberty(-) to authority(+).
var AX = {
  x:{e_public:-1,e_abolish:-1,e_plan:-1,e_coop:-.7,e_welfare:-.6,e_union:-.5,e_jobs:-.3,m_value:-.4,m_conflict:-.4,m_power:-.4,m_conc:-.4,e_market:1,e_small:1,k_inherit:.2},
  y:{l_rights:-1,l_choice:-1,a_nostate:-1,a_illegit:-.8,t_statefirst:1,t_oneparty:1,t_violence:1,tt_loyalty:.8,tt_surveil:.8,tt_children:.8,tt_ban:.8,k_obey:.8,t_relig_law:1,t_relig_dissent:1,n_over_rights:.8,t_hered:.6,t_crown:.6,n_unity:.6,r_law:.3,k_order:.3}
};

// Option helper. s: claims supported (optionally "id:.5"), n: claims the option opposes.
function o(t, s, n){ return {t:t, s:s||[], n:n||[]}; }
function ox(t, s, n){ var r=o(t,s,n); r.x=true; return r; }

var SETUP = [
  {id:"self", q:"Which word do you most often use for your own politics?", note:"Answer honestly. It will be compared with your answers at the end.", o:[
    {t:"Liberal", k:["liberal"]}, {t:"Progressive", k:["progressive"]}, {t:"Conservative", k:["conservative"]}, {t:"Libertarian", k:["libertarian"]},
    {t:"Socialist", k:["demsoc","marketsoc","communist","socdem"]}, {t:"Populist", k:["leftpop","rightpop"]}, {t:"Moderate or independent", k:[]}, {t:"I don't use one", k:[]}]},
  {id:"party", q:"Which party do you usually vote for?", o:[
    {t:"Democratic"},{t:"Republican"},{t:"A third party"},{t:"No party, I pick person by person"},{t:"I don't vote"}]}
];

var QS = [
 // ---- Economy

    '<div class="card"><p class="eyebrow">' + esc(q.sec) + '</p><h2 class="q">' + esc(q.q) + '</h2>' +
    (q.note ? '<p class="note">' + esc(q.note) + '</p>' : (q.type === "multi" ? '<p class="note">Select all that apply.</p>' : '')) + '<div id="qbody"></div><p class="hint" id="hint"></p></div>' +
    '<div class="nav"><button class="btn" data-act="back">Back</button><button class="btn primary" data-act="next">' + (S.idx === total - 1 ? 'See my result' : 'Next') + '</button></div>';
  app.innerHTML = h; renderBody();
}
function renderBody(){
  var q = ALL[S.idx], a = S.ans[q.id], body = document.getElementById("qbody");
  body.innerHTML = q.o.map(function(op, i){
    var on = q.type === "multi" ? (Array.isArray(a) && a.indexOf(i) >= 0) : a === i;
    return '<button type="button" class="opt' + (on ? ' on' : '') + '" data-act="pick" data-i="' + i + '" aria-pressed="' + on + '"><span class="key">' + (q.type === "multi" ? (on ? '✓' : '') : String.fromCharCode(65 + i)) + '</span><span class="otxt">' + esc(op.t) + '</span></button>';
  }).join("");
}
function setHint(t){ var h = document.getElementById("hint"); if (h) h.textContent = t || ""; }

function meter(name, p, left, right, note){
  return '<div class="meter"><p class="mname">' + esc(name) + '</p><div class="mbar"><i style="left:' + Math.max(0, Math.min(100, p * 100)) + '%"></i></div><p class="mends"><span>' + esc(left) + '</span><span>' + esc(right) + '</span></p>' + (note ? '<p class="cap">' + note + '</p>' : '') + '</div>';
}
function claimList(ids, cv){
  return '<ul class="evid">' + ids.map(function(c){
    var v = cv[c] ? cv[c].v : null, st = v == null ? "Not asked" : v > .25 ? "You agree" : v < -.25 ? "You don't" : "Mixed";
    return '<li><span class="eh">' + st + '</span>' + esc(CLAIMS[c]) + '</li>';
  }).join("") + '</ul>';
}
function mapSvg(r){
  var W = 360, C = W / 2, R = 140;
  var X = function(x){ return C + x * R; }, Y = function(y){ return C - y * R; };
  var s = '<svg class="map" viewBox="0 0 ' + W + ' ' + W + '" role="img" aria-label="Map of your position"><rect class="plot" x="20" y="20" width="320" height="320"/><line class="cross" x1="20" y1="' + C + '" x2="340" y2="' + C + '"/><line class="cross" x1="' + C + '" y1="20" x2="' + C + '" y2="340"/>' +
    '<text class="axl" x="26" y="' + (C - 6) + '">COLLECTIVE</text><text class="axl" x="334" y="' + (C - 6) + '" text-anchor="end">MARKETS</text><text class="axl" x="' + (C + 6) + '" y="34">AUTHORITY</text><text class="axl" x="' + (C + 6) + '" y="334">LIBERTY</text>';
  var placed = [];
  r.labels.slice(0, 3).forEach(function(e){
    var p = labelPos(e.l), cx = X(p.x), cy = Y(p.y), left = cx > C + 40, ty = cy + 4;
    placed.forEach(function(q){ if (Math.abs(q.y - ty) < 14 && Math.abs(q.x - cx) < 150) ty = q.y + 14; });
    placed.push({x:cx, y:ty});
    s += '<circle class="tdot" cx="' + cx + '" cy="' + cy + '" r="5"/><text class="tlab" x="' + (cx + (left ? -9 : 9)) + '" y="' + ty + '" text-anchor="' + (left ? 'end' : 'start') + '">' + esc(e.l.name) + '</text>';
  });
  var yx = X(r.pos.x), yy = Y(r.pos.y);
  s += '<circle class="you" cx="' + yx + '" cy="' + yy + '" r="9"/><text class="ylab" x="' + yx + '" y="' + (yy - 15) + '" text-anchor="middle">You</text></svg>';
  return s;
}
function renderResults(){
  var r = scoreAll(S.ans), t = r.top, l = t.l, cv = r.cv;
  var h = '<div class="top"><span class="brand">Plumb Line</span><span class="count">Result</span></div><p class="eyebrow" style="margin-top:18px">What your answers add up to</p>';
  h += '<div class="res">';
  if (r.mixed) {
    h += '<h1 class="big">Mixed, or hard to place</h1><p class="match">Closest: ' + esc(t.l.name) + ' ' + pct(t.pct) + '%, then ' + esc(r.second.l.name) + ' ' + pct(r.second.pct) + '%</p>' +
      '<p style="margin-top:12px">No single label fits your answers well. That is a result, not a failure: your views mix positions that labels usually keep apart. The closest labels, and the claims pulling each way, are below.</p>';
  } else {
    h += '<h1 class="big">' + esc(l.name) + '</h1><p class="match"><span>' + pct(t.pct) + '%</span> match, with ' + esc(r.second.l.name) + ' next at ' + pct(r.second.pct) + '%</p><p style="margin-top:12px">' + esc(l.tell) + '</p><p class="cap">Thinkers in this tradition: ' + esc(l.anchors) + '.</p>';
  }
  h += '</div>';
  h += '<div class="res"><h3>Where you sit</h3>' + mapSvg(r) + '<p class="cap">Horizontal: how far you lean toward public and worker ownership (left) or private markets (right). Vertical: how much authority over individuals you accept (up) or how much liberty you insist on (down). Teal dots are the three closest labels.</p></div>';
  h += '<div class="res"><h3>What the match rests on</h3><p class="cap">The core claims of ' + esc(l.name) + ', and where you landed on each.</p>' + claimList(l.has, cv) + '</div>';
  // aisle
  h += '<div class="res"><h3>Where you cross the aisle</h3>';
  if (r.aisle.length) {
    h += '<p class="cap">Labels on the other side of the map that share claims with you.</p><ul class="think">' + r.aisle.map(function(a){
      return '<li><b>' + esc(a.l.name) + '</b> <span class="match">' + a.got.length + ' of ' + a.n + ' claims</span><br>' + a.got.map(function(c){ return esc(CLAIMS[c]); }).join("<br>") + '</li>';
    }).join("") + '</ul>';
  } else h += '<p>No label on the other side shares at least two claims, and 40% of its list, with your answers.</p>';
  h += '</div>';
  // edge
  var near = r.edges[0];
  h += '<div class="res"><h3>How close to an edge</h3><p>' + (near.got.length ? 'Closest edge: <b>' + esc(near.e.name) + '</b>, ' + near.got.length + ' of ' + near.e.claims.length + ' tripwire claims.' : 'You accept none of the tripwire claims of any edge.') + '</p>' +
    '<p class="cap">An edge is defined by means (abolition, force, one-party rule, hereditary or religious command), not by where you sit on the map. A committed socialist or libertarian can be nowhere near one.</p>' +
    r.edges.map(function(e){ return meter(e.e.name, e.share, '0 tripwire claims', 'all ' + e.e.claims.length, e.got.length ? 'You accept: ' + e.got.map(function(c){ return esc(CLAIMS[c]); }).join(' ') : ''); }).join("") + '</div>';
  // readouts
  h += '<div class="res"><h3>Readouts</h3>' +
    '<p class="mname">Marxist analysis and communist program</p><p>You accept <b>' + r.marxA.a + ' of ' + r.marxA.n + '</b> Marxist claims about how the economy works (workers create value, owners and workers conflict, capital buys power, wealth concentrates) and <b>' + r.marxP.a + ' of ' + r.marxP.n + '</b> about what to do (end private industry, plan centrally, one-party rule, revolution).</p>' +
    meter('State control over private life', r.tt, 'None', 'Total', 'Level: <b>' + r.ttBand + '</b>. This is the share of state-control claims you accept: required loyalty, watching private messages, state-set teaching, bans on groups, and one-party rule.') +
    meter('Why outcomes differ', (r.struct + 1) / 2, 'Individual choices', 'Systems and structures', '') +
    '<p class="mname">Foreign policy</p><p><b>' + esc(r.fp[0].s.name) + '</b> ' + pct(r.fp[0].pct) + '%. ' + esc(r.fp[0].s.tell) + ' <span class="cap">Thinkers: ' + esc(r.fp[0].s.anchors) + '. Next: ' + esc(r.fp[1].s.name) + ' ' + pct(r.fp[1].pct) + '%.</span></p>';
  var sel = S.ans.self, selOp = typeof sel === "number" ? SETUP[0].o[sel] : null, pty = typeof S.ans.party === "number" ? SETUP[1].o[S.ans.party].t : null;
  if (selOp) {
    var line = 'You called yourself <b>' + esc(selOp.t) + '</b>';
    if (selOp.k && selOp.k.length) {
      var best = r.labels.filter(function(e){ return selOp.k.indexOf(e.l.id) >= 0; })[0], rank = r.labels.indexOf(best) + 1;
      line += '. Your answers match ' + esc(best.l.name) + ' at ' + pct(best.pct) + '%, which ranks ' + rank + ' of ' + r.labels.length + ' labels for you.';
    } else line += '.';
    if (pty) line += ' You usually vote: ' + esc(pty) + '.';
    h += '<p class="mname">Your word and your answers</p><p>' + line + '</p>';
  }
  h += '</div>';
  h += '<div class="res"><h3>Every label, ranked</h3><ul class="swaps">' + r.labels.map(function(e){ return '<li><div class="sh"><b>' + esc(e.l.name) + '</b><span class="chip">' + pct(e.pct) + '%</span></div></li>'; }).join("") + '</ul></div>';
  h += '<div class="row"><button class="btn primary" data-act="share">Share my result</button><button class="btn" data-act="retake">Retake</button></div><div id="cpy"></div><p class="hint" id="hint"></p><p class="cap">Sharing sends only what you choose. This page stores nothing on a server.</p>';
  app.innerHTML = h;
}
function resultText(){
  var r = scoreAll(S.ans), t = r.top;
  return "Plumb Line result\n" + (r.mixed ? "Mixed or hard to place (closest: " + t.l.name + " " + pct(t.pct) + "%, " + r.second.l.name + " " + pct(r.second.pct) + "%)" : t.l.name + " " + pct(t.pct) + "%") +
    "\nForeign policy: " + r.fp[0].s.name + "\nState control: " + r.ttBand + "\nClosest edge: " + r.edges[0].e.name + " (" + r.edges[0].got.length + " of " + r.edges[0].e.claims.length + ")\nMarxist analysis claims: " + r.marxA.a + "/" + r.marxA.n + ", program claims: " + r.marxP.a + "/" + r.marxP.n;
}

app.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]"); if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "start") { S.idx = 0; save(); render(); }
  else if (act === "pick") {
    var q = ALL[S.idx], i = +el.getAttribute("data-i");
    if (q.type === "multi") {
      var a = Array.isArray(S.ans[q.id]) ? S.ans[q.id].slice() : [], at = a.indexOf(i);
      if (at >= 0) a.splice(at, 1);
      else if (q.o[i].x) a = [i];
      else { a = a.filter(function(j){ return !q.o[j].x; }); a.push(i); }
      S.ans[q.id] = a;
    } else S.ans[q.id] = i;
    save(); renderBody(); setHint("");
  }
  else if (act === "next") {
    var cq = ALL[S.idx];
    if (!valid(cq)) { setHint(cq.type === "multi" ? "Pick at least one, or the last option if none apply." : "Pick one to continue."); return; }
    S.idx++; save(); render();
  }
  else if (act === "back") { if (S.idx > 0) { S.idx--; save(); render(); } else { S.idx = -1; save(); render(); } }
  else if (act === "retake") { if (confirm("Clear your answers and start over?")) { S = fresh(); save(); render(); } }
  else if (act === "share") {
    var txt = resultText(), box = document.getElementById("cpy");
    if (navigator.share) { navigator.share({title: "My Plumb Line result", text: txt, url: location.href}).catch(function(){}); return; }
    var fallback = function(){ box.innerHTML = '<textarea class="copybox" readonly></textarea>'; var ta = box.firstChild; ta.value = txt; ta.select(); setHint("Select and copy the text below."); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ setHint("Copied."); }, fallback); else fallback();
  }
});
S = load() || fresh();
render();
</script></html>
